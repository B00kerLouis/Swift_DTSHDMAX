name: macOS Release Build

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Xcode Build ALL (Release)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Release (hdmax + libhdmax)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Swift_DTSHDMAX.xcodeproj \
            -scheme "Build ALL" \
            -configuration Release \
            -derivedDataPath Build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Confirm products
        run: |
          set -euo pipefail
          PRODUCTS="$(find Build/DerivedData -type d -path '*/Build/Products/Release' | head -1)"
          test -n "${PRODUCTS}"
          test -x "${PRODUCTS}/hdmax"
          test -d "${PRODUCTS}/libhdmax.framework"
          "${PRODUCTS}/hdmax" --help | head -40
          echo "Products OK under ${PRODUCTS}"
