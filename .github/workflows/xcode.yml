name: Xcode build and codec regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build CLI and Framework from source
        run: |
          set -euo pipefail
          mkdir -p Build/CI/Logs
          for configuration in Release Debug; do
            options=(CODE_SIGNING_ALLOWED=NO)
            if [[ "$configuration" == Debug ]]; then
              options+=(SWIFT_OPTIMIZATION_LEVEL=-O)
            fi
            xcodebuild -project Swift_DTSHDMAX.xcodeproj -scheme "Build ALL" \
              -configuration "$configuration" \
              -derivedDataPath "Build/CI/DerivedData/$configuration" \
              CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/Build/CI/Products/$configuration" \
              OBJROOT="$GITHUB_WORKSPACE/Build/CI/Intermediates/$configuration" \
              "${options[@]}" build \
              2>&1 | tee "Build/CI/Logs/build-$configuration.log"
            test -x "Build/CI/Products/$configuration/hdmax"
            test -f "Build/CI/Products/$configuration/libhdmax.framework/libhdmax"
          done
      - name: Run in-memory codec regressions
        run: |
          set -euo pipefail
          for check in verify-encode-modes verify-object-modes verify-dtsx-navigation-width \
            verify-xllx-native-encoder verify-dtsx-native-encoder verify-dtsx-imax-encoder \
            verify-dtsx-dynamic-encoder verify-multi-bed; do
            Build/CI/Products/Debug/hdmax "$check" \
              | tee "Build/CI/Logs/$check.json"
          done
      - name: Report compiler diagnostics
        if: always()
        run: |
          for log in Build/CI/Logs/build-*.log; do
            if [[ -f "$log" ]]; then
              grep -nE 'warning:|error:' "$log" || true
            fi
          done
      # Programme playback uses the local official player and external media;
      # these in-memory checks do not establish DTS:X presentation acceptance.
